# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # [2026-08-03] "☀️ haejun" → "Haejun" — 상단 통합 바에서 브랜드 텍스트로
  # 쓰인다(PageTitle 컴포넌트). og:site_name(Head.tsx:65)에도 쓰이므로
  # 소셜 미리보기 사이트명도 함께 바뀐다.
  # [2026-08-04] "Haejun" → "hae.log" → "H Y U N"(사용자가 직접 자간 넓힌
  # 버전으로 교체) → "HYUNATLAS"(촌스럽다는 피드백으로 재검토).
  # HYUNATLAS 선정 근거: "Atlas"=지도책은 실제로 GIS(공간 데이터 분석) 노트를
  # 쓰는 분야와 직접 연결되는 은유이면서, 동시에 "내 지식/삶의 지도"라는
  # 뜻으로 향후 추가될 개인적 콘텐츠까지 자연스럽게 품는다. 공백·점 없는
  # 단일 단어 조건(사용자 요청)도 만족.
  pageTitle: HYUNATLAS
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-6XY03WD2ST
  locale: en-US
  baseUrl: haejunhyun.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Google Fonts URL 구성 + og-image(satori) 폰트 로드에 쓰인다.
      # 실제 브라우저 표시 폰트(--bodyFont 등)는 아래 `fonts` 플러그인 옵션이
      # 최종 결정한다(그 CSS가 가장 뒤에 로드됨) — 두 값이 같아야 일관된다.
      header: Nanum Myeongjo
      body: Noto Sans KR
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#fafaf8"
        lightgray: "#e8e4de"
        gray: "#a09890"
        darkgray: "#3d3833"
        dark: "#1a1612"
        secondary: "#3d6b8e"
        tertiary: "#6a9ab8"
        highlight: rgba(61,107,142,0.10)
        textHighlight: "#fde68a88"
      darkMode:
        light: "#1a1e24"
        lightgray: "#2a3040"
        gray: "#5a6478"
        darkgray: "#b8c4d4"
        dark: "#e8edf5"
        secondary: "#7aaed4"
        tertiary: "#9cc4e4"
        highlight: rgba(122,174,212,0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: published
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: catppuccin-latte
        dark: github-dark
      keepBackground: true
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: ./plugins/summary-description
    enabled: true
    options: {}
    # [리디자인 P1] obsidian-flavored-markdown(30) 다음, description(70) 이전.
    # `[!summary]` 콜아웃 본문만 frontmatter.description에 채워 넣어, description
    # 플러그인이 렌더 텍스트를 앞에서부터 잘라 만들던 기존 description에 콜아웃
    # 타이틀 리터럴("Summary"/"요약")이 섞이는 문제를 해소한다. 상세 근거는
    # 플러그인 소스 상단 주석 참고.
    order: 35
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    options:
      maxDepth: 2
    layout:
      position: right
      # [리디자인] 30 → 10. 우측 사이드바는 priority 오름차순으로 위→아래 배치된다
      # (config-loader.ts:910 `entries.sort((a,b) => a.priority - b.priority)`).
      # 기존엔 graph(10) → toc(30) → backlinks(50) 순이라 그래프가 맨 위였다.
      # 노트를 읽는 동안 실제로 쓰는 건 목차이므로 toc를 최상단으로 올린다.
      # 결과 순서: toc(10) → graph(30) → backlinks(50)
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    # [2026-08-02 버그픽스, 유지] 옵션 없이 켜두면 이 플러그인이 **자기 기본값**
    # (Schibsted Grotesk / Source Sans Pro / IBM Plex Mono)으로 CSS를 emit하고,
    # 그 파일(static/resource-style-*.css)이 코어 테마 CSS보다 **뒤에** 로드되어
    # `configuration.theme.typography`를 통째로 덮어썼다.
    # → 그동안 사이트는 Nanum Myeongjo가 아니라 Schibsted Grotesk로 렌더됐고,
    #   한글은 폴백 스택도 없이 브라우저 기본 폰트로 떨어지고 있었다.
    # 옵션 없이 되돌리면 이 버그가 재발하므로, 본문 폰트를 Pretendard→Noto Sans KR로
    # 롤백한 뒤에도 옵션 명시는 그대로 유지한다. fontOrigin: local = 이 플러그인은
    # 폰트를 로드하지 않는다는 뜻("로컬 폰트"가 아니라 "로딩 안 함"). 실제 로딩은
    # 코어 theme.fontOrigin(googleFonts)이 담당.
    options:
      fontOrigin: local
      header: '"Nanum Myeongjo", serif'
      body: '"Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif'
      code: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: ./plugins/topics-page
    enabled: true
    # [리디자인 Phase 6] /topics 가상 페이지. match는 항상 false(실제 콘텐츠
    # 파일을 가로채지 않음) — generate()가 만드는 가상 페이지 하나만 이
    # 페이지타입 소유. priority 5로 낮게 둬 folder/tag-page(10)와 매치
    # 우선순위 충돌 여지를 없앰(어차피 match가 항상 false라 실질적 영향 없음).
    options: {}
  - source: ./plugins/archive-page
    enabled: true
    # [리디자인 Phase 6] /archive 가상 페이지. topics-page와 동일한 패턴.
    options: {}
  - source: github:quartz-community/explorer
    enabled: true
    options:
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50
      display: desktop-only
      # [리디자인] 홈에서 숨김. GlobalNav(Home|Topics|Archive) + TopicGrid가
      # 이제 홈의 1차 탐색을 담당해, 폴더 트리 전체를 나열하는 Explorer는
      # 중복 내비게이션이 됐다(사용자가 지적한 좌우 패널 중복 문제).
      # 노트 상세·폴더·태그 페이지에서는 그대로 유지 — 그 페이지들에선
      # 여전히 유일한 폴더 트리 탐색 수단이다.
      condition: not-index
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      # [리디자인] 10 → 30. toc 아래로 내린다 (toc 주석 참고).
      priority: 30
      # [리디자인 P4] 홈에서 제거. 홈의 그래프는 연결이 없어 노드 1개짜리
      # 빈 박스로 렌더돼 죽은 UI였다. 노트 상세의 local graph는 그대로 유지.
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: ./plugins/global-nav
    enabled: true
    # [리디자인, 2026-08-03 위치 정정] 최초엔 beforeBody(priority 0)에 두어
    # "brand 바"(PageTitle+SocialLinks+Search+Darkmode, left 포지션)와
    # "nav 바"(이 컴포넌트, beforeBody)가 홈에서 위아래로 **분리된 두 줄**로
    # 렌더됐다 — 목업(haejun-redesign-abc.html:435-441 `.site-hd`)은
    # brand+nav+search+darkmode가 **한 줄**이라 지적받음.
    #
    # 두 블록은 서로 다른 grid-area(grid-sidebar-left vs grid-header)에
    # 렌더되는 별개 DOM 서브트리라 CSS만으로는 한 줄로 합칠 수 없다 — 유일한
    # 해법은 이 컴포넌트를 left 포지션으로 옮겨 같은 flex row(.left.sidebar)
    # 안에 넣는 것. priority 11 = page-title(10) 바로 다음, social-links(13)
    # 이전 — 렌더 순서가 [PageTitle "haejun"] [이 nav] ... margin-left:auto ...
    # [SocialLinks] [Search+Darkmode]가 되어 목업의 "좌: 브랜드+내비 / 우: 검색+
    # 아이콘" 그룹핑과 일치한다. 홈에서는 이 줄 전체가 이미 상단 가로 바로
    # 재배치돼 있다(custom.scss §10.5). 노트/폴더/태그 페이지에서는 좌측
    # 세로 컬럼 안에 자연스럽게 한 항목으로 들어간다 — 사이트 전역 노출
    # 요구사항은 유지된다.
    options: {}
    order: 15
    layout:
      position: left
      priority: 11
  - source: ./plugins/home-hero
    enabled: true
    # [리디자인 Phase 4] Hero + StatsStrip, 홈 전용. `is-index` 조건이 내장되어
    # 있지 않고(REDESIGN-GUIDE.md F5 — not-index의 역만 내장) 등록 실패 시
    # "항상 렌더"로 폴백되어 모든 노트에 Hero가 뜨는 눈에 띄는 회귀가 생기므로,
    # recent-notes-index와 동일하게 컴포넌트 내부 `fileData.slug !== "index"`
    # 가드를 쓴다(HomeHero.tsx). priority 1 = article-title(10)보다 위.
    #
    # 카피(headline/description/eyebrow)는 검토 필요 — design-handoff.md 목업
    # 원문("데이터 엔지니어링과 공간 데이터" 중심 소개)은 REDESIGN-GUIDE.md F2
    # 실측(Programming 39건 > Data Engineering 19건, 나머지는 한 자릿수)과
    # 어긋나 실제 분포에 맞게 다시 썼다. headline만 content/index.md의 기존
    # 문구를 그대로 가져왔고, eyebrow/description은 이번에 새로 쓴 문구라
    # 본인 목소리로 맞는지 검토 권장.
    options:
      eyebrow: "blue notes. 🎷"
      headline: "어쩌다 보니 모인\n관심사의 파편들"
      description: "일로 만지는 데이터와 코드, 취미로 치는 기타. 정해진 주제나 규칙 없이 그저 내게 필요한 것들을 모아두는 아카이브입니다."
      links:
        - label: "Play Notes"
          href: "#recent"
          primary: true
        - label: "GitHub"
          href: "https://github.com/haden-hyun/haejunhyun.com"
        - label: "LinkedIn"
          href: "https://www.linkedin.com/in/haejun-hyun-332b76243/"
      avatarInitial: "H"
      avatarImage: "./static/avatar.png"
    order: 15
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/featured-notes
    enabled: true
    # [리디자인 Phase 4, 2026-08-03 순서 정정] Featured, 홈 전용. priority 2 =
    # Hero(1) 바로 아래. 목업(haejun-redesign-abc.html:470-548) 재확인 결과
    # 홈 섹션 순서는 Hero → **Featured → Topics** → Recent Notes였다 — 초판은
    # Topics를 Featured보다 앞에 둬 순서가 어긋나 있었다.
    #
    # featured/pinned frontmatter 실측 0건이라 토픽 라운드로빈 자동 선정으로
    # 시작(REDESIGN-GUIDE.md F3) — 나중에 frontmatter.featured: true를 달면
    # 자동으로 우선 적용된다(FeaturedNotes.tsx 참고).
    #
    # recentExcludeCount: 6 — 아래 recent-notes-index의 options.limit: 6과
    # 반드시 같은 값을 유지할 것. Featured의 자동 선정이 Recent Posts 상위
    # 6개를 후보에서 제외해 홈 화면 중복 노출을 막는다(둘 중 하나를 바꾸면
    # 이 값도 함께 바꿀 것 — 실제 런타임 결합은 아니고 설정값을 나란히
    # 맞추는 수준의 절충).
    options:
      recentExcludeCount: 6
    order: 15
    layout:
      position: beforeBody
      priority: 2
  - source: ./plugins/topic-grid
    enabled: true
    # [리디자인 Phase 4, 2026-08-03 순서 정정] TopicGrid, 홈 전용(내부 가드는
    # home-hero와 동일 패턴). priority 3 = Featured(2) 바로 아래 — 목업 순서
    # Hero→Featured→Topics→Recent Notes에 맞춤(위 featured-notes 주석 참고).
    # content/index.md의 정적 Interests 표를 대체한다(P5) — 표 자체는 이
    # 커밋에서 index.md 본문에서 제거했다.
    options:
      showHeader: true
    order: 15
    layout:
      position: beforeBody
      priority: 3
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      # [리디자인 Phase 4] 홈은 이제 HomeHero가 헤드라인을 대신 보여준다 —
      # 그대로 두면 "Haejun Second Brain" 페이지 타이틀과 Hero 헤드라인이 중복 노출된다.
      condition: not-index
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      # 홈은 "포스트"가 아니라 인덱스라 날짜·읽기시간 메타가 의미 없다.
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: not-index
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: haden-hyun/haejunhyun.com
        repoId: R_kgDONbw-1g
        category: Announcements
        categoryId: DIC_kwDONbw-1s4Cky-B
    layout:
      position: afterBody
      priority: 50
      # [리디자인 P6] 홈에서 댓글 섹션 제거. `0 comments`가 첫인상에 노출되는 것을
      # 막는다. 노트 상세에서는 그대로 유지.
      condition: not-index
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 15
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: ./plugins/social-links
    enabled: true
    options:
      links:
        - name: GitHub
          url: https://github.com/haden-hyun/haejunhyun.com
          icon:
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438
            9.8 8.207
            11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729
            1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304
            3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381
