# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # 사이트 브랜드명. PageTitle 컴포넌트 + og:site_name에 쓰인다.
  pageTitle: HAEJUN RECORDS
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-6XY03WD2ST
  locale: en-US
  baseUrl: haejunhyun.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Google Fonts URL 구성 + og-image(satori) 렌더용. 실제 브라우저 표시
    # 폰트는 아래 `fonts` 플러그인 옵션이 최종 결정하므로 두 값을 맞춰 유지.
    #
    # 폰트 방향: 로고(title)=Anton, 헤딩(header)=Hahmlet, 본문(body)=Noto
    # Sans KR, 코드=JetBrains Mono. 로고를 헤딩과 분리해 브랜드 존/가독성
    # 존을 나눈다. weights는 각 서체 실사용 굵기에 맞춰 명시.
    typography:
      title:
        name: Anton
        weights: [400]
      header:
        name: Hahmlet
        weights: [400, 700, 900]
      body: Noto Sans KR
      code: JetBrains Mono
    # [2026-08-05] "True Midnight" — Blue Note/Blue Giant 레퍼런스 커버에서
    # 실제 픽셀을 추출해 재구성한 팔레트. 라이트=크림 인쇄지(True Blue 커버),
    # 다크=잉크 네이비(Blue Giant). accent hue는 True Blue(H208)와
    # Midnight Blue(H202)의 중간값 H207.
    #
    # 모든 값은 WCAG 대비 계산으로 검증됨 — 본문/제목 AAA, 나머지 AA 이상.
    # 이전 팔레트에서 고친 결함 2건(둘 다 텍스트에 쓰이는데 AA 미달이었음):
    #   gray     #a09890 → 2.72:1  (날짜·읽기시간·Explorer·TOC·캡션)
    #   tertiary #6a9ab8 → 2.90:1  (링크 hover 색, base.scss:96)
    # tertiary는 "hover 시 밝아짐"에서 "진해짐"으로 방향을 바꿨다 —
    # 라이트 배경에서 밝아지면 대비가 떨어져 AA를 만족시킬 수 없다.
    colors:
      lightMode:
        light: "#f7f5ef" # bg · 크림 인쇄지 (순백 대비 광량 91.3%)
        lightgray: "#e4dfd4" # border
        gray: "#676f7c" # meta          4.65:1  AA
        darkgray: "#323e4c" # body          9.99:1  AAA
        dark: "#141d28" # heading      15.58:1  AAA
        secondary: "#1c5f95" # accent        6.17:1  AA
        tertiary: "#17527f" # accent hover  7.55:1  AAA
        highlight: rgba(28,95,149,0.10)
        textHighlight: "#fde68a88"
      darkMode:
        light: "#0e1420" # bg · 잉크 네이비 (Blue Giant #0c0c24 계열)
        lightgray: "#1e2836" # border
        gray: "#7c8899" # meta          5.12:1  AA
        darkgray: "#bcc9d9" # body         10.96:1  AAA
        dark: "#e9eff7" # heading      15.93:1  AAA
        secondary: "#6fb2e0" # accent        8.00:1  AAA
        tertiary: "#9dcdec" # accent hover 10.86:1  AAA
        highlight: rgba(111,178,224,0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: published
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: catppuccin-latte
        dark: github-dark
      keepBackground: true
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: ./plugins/summary-description
    enabled: true
    options: {}
    # `[!summary]` 콜아웃 본문을 frontmatter.description으로 추출.
    # description(70) 플러그인보다 먼저 실행돼야 하므로 order: 35.
    order: 35
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    options:
      maxDepth: 2
    layout:
      position: right
      # 우측 사이드바는 priority 오름차순 배치. toc를 최상단에 둔다.
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    # 실제 --titleFont/--headerFont/--bodyFont/--codeFont 값은 여기서 결정된다
    # (가장 뒤에 로드되어 최종 승리). 옵션을 비우면 플러그인 기본값(Schibsted
    # Grotesk 등)으로 덮어써지므로 반드시 명시. fontOrigin: local = 이
    # 플러그인은 폰트를 로드하지 않음 — 실제 로딩은 위 theme.fontOrigin이 담당.
    options:
      fontOrigin: local
      title: '"Anton", sans-serif'
      header: '"Hahmlet", serif'
      body: '"Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif'
      code: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: ./plugins/topics-page
    enabled: true
    # /topics 가상 페이지 (실제 콘텐츠 파일과 매치되지 않음).
    options: {}
  - source: ./plugins/archive-page
    enabled: true
    # /archive 가상 페이지, topics-page와 동일한 패턴.
    options: {}
  - source: github:quartz-community/explorer
    enabled: true
    options:
      folderClickBehavior: collapse
      # [2026-08-05] 이전엔 true — 예전에 손으로 펼친 다른 토픽 폴더가
      # localStorage에 계속 남아 세션 내내 트리가 길어지는 문제(사용자
      # 피드백: "위계 구분이 어렵고 트리도 길어진다"). 현재 파일의 상위
      # 경로는 explorer.inline.ts가 어차피 자동으로 펼쳐주므로(코드 확인:
      # "폴더가 현재 slug의 prefix면 강제 open"), 저장 상태 없이도 탐색에
      # 지장 없음 — 매 페이지 진입 시 현재 경로만 펼치고 나머진 항상 접힘.
      useSavedState: false
    layout:
      position: left
      priority: 50
      display: desktop-only
      # 홈에서 숨김 — GlobalNav+TopicGrid가 1차 탐색을 대신한다.
      condition: not-index
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 30
      # 홈에서 제거 — wikilink가 적어 노드 1개짜리 빈 박스로 렌더된다.
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: topbar
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: ./plugins/global-nav
    enabled: true
    # Home|Topics|Archive 내비. topbar 포지션 — PageTitle과 같은 줄(.topbar)에
    # 렌더돼 모든 페이지에서 브랜드+내비가 한 줄로 보인다(custom.scss §10.5).
    options: {}
    order: 15
    layout:
      position: topbar
      priority: 11
  - source: ./plugins/home-hero
    enabled: true
    # Hero + StatsStrip, 홈 전용(컴포넌트 내부 slug 가드). priority 1 = 최상단.
    options:
      eyebrow: "blue notes. 🎷"
      headline: "어쩌다 보니 모인\n관심사의 파편들"
      description: "일로 만지는 데이터와 코드, 취미로 치는 기타. 정해진 주제나 규칙 없이 그저 내게 필요한 것들을 모아두는 아카이브입니다."
      links:
        - label: "Play Notes"
          href: "#recent"
          primary: true
        - label: "GitHub"
          href: "https://github.com/haden-hyun/haejunhyun.com"
        - label: "LinkedIn"
          href: "https://www.linkedin.com/in/haejun-hyun-332b76243/"
      avatarImage: "./static/avatar.png"
    order: 15
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/featured-notes
    enabled: true
    # Featured, 홈 전용. priority 2 = Hero 바로 아래. featured frontmatter가
    # 없으면 토픽 라운드로빈으로 자동 선정 — `featured: true`를 달면 우선 적용.
    # recentExcludeCount는 아래 recent-notes-index.limit과 같은 값을 유지할 것
    # (홈 화면 중복 노출 방지, 설정값을 나란히 맞추는 수준의 결합).
    options:
      recentExcludeCount: 6
    order: 15
    layout:
      position: beforeBody
      priority: 2
  - source: ./plugins/topic-grid
    enabled: true
    # TopicGrid, 홈 전용. priority 3 = Featured 바로 아래.
    options:
      showHeader: true
    order: 15
    layout:
      position: beforeBody
      priority: 3
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      # 홈은 HomeHero가 헤드라인을 대신 보여주므로 제외 (중복 방지).
      condition: not-index
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      # 홈은 인덱스라 날짜·읽기시간 메타가 의미 없다.
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: not-index
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: topbar
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: topbar
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: topbar
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: haden-hyun/haejunhyun.com
        repoId: R_kgDONbw-1g
        category: Announcements
        categoryId: DIC_kwDONbw-1s4Cky-B
    layout:
      position: afterBody
      priority: 50
      # 홈에서 댓글 섹션 제거 — `0 comments`가 첫인상에 노출되는 것 방지.
      condition: not-index
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: topbar
      priority: 15
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: ./plugins/social-links
    enabled: true
    options:
      links:
        - name: GitHub
          url: https://github.com/haden-hyun/haejunhyun.com
          icon:
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438
            9.8 8.207
            11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729
            1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304
            3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381
            1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005
            2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235
            3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589
            8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        - name: LinkedIn
          url: https://www.linkedin.com/in/haejun-hyun-332b76243/
          icon:
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761
            2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966
            0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5
            12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
    order: 15
    layout:
      position: topbar
      priority: 13
  - source: ./plugins/recent-notes-index
    enabled: true
    # 홈 "Recent Notes" 섹션. linkToMore는 /archive로 연결.
    options:
      title: "Recent Notes"
      limit: 6
      showTags: true
      linkToMore: "archive"
      linkToMoreLabel: "아카이브 →"
    order: 15
    layout:
      position: afterBody
      priority: 40
  - source: ./plugins/prev-next
    enabled: true
    options: {}
    order: 15
    layout:
      position: afterBody
      priority: 30
  - source: ./plugins/related-notes
    enabled: false
    # 노트 하단 "연결된 노트" 섹션 — [2026-08-05] 사용자 요청으로 제거.
    # 우측 사이드바의 backlinks는 유지(별개 컴포넌트, 그대로 남음).
    options: {}
    order: 15
    layout:
      position: afterBody
      priority: 45
  - source: ./plugins/reading-progress
    enabled: true
    options: {}
    order: 15
    layout:
      position: afterBody
      priority: 10
  - source: ./plugins/back-to-top
    enabled: true
    options: {}
    order: 15
    layout:
      position: afterBody
      priority: 15
  - source: ./plugins/image-lightbox
    enabled: true
    options: {}
    order: 20
    layout:
      position: afterBody
      priority: 20
  - source: ./plugins/visitor-counter
    # 독립 위치 없음 — footer가 npm(file:) 의존성으로 직접 렌더한다.
    # layout 키를 비워 위치 기반 렌더 대상에서 제외.
    enabled: true
    options: {}
    order: 15
  - source: ./plugins/goatcounter-tracking
    enabled: true
    options:
      site: haejunhyun
      scriptSrc: //gc.zgo.at/count.js
    order: 90
  - source: ./plugins/footer
    enabled: true
    options:
      links: {}
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
        topbar: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
    # topics/archive 가상 페이지 — folder/tag와 동일하게 우측 사이드바만 비움.
    topics:
      exclude:
        - reader-mode
      positions:
        right: []
    archive:
      exclude:
        - reader-mode
      positions:
        right: []
