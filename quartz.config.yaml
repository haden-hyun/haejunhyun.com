  - source: ./plugins/recent-notes-index
    enabled: true
    # 홈 Recent Notes. priority 3 = Featured 아래, TOPICS와 2단. 같은 날짜·폴더 3편 이상은 한 행으로 묶인다.
    options:
      title: "Recent Notes"
      limit: 5
      showTags: true
      linkToMore: "archive"
      linkToMoreLabel: "Archive →"
      seriesTitles: *seriesTitles
      folderTitles: *folderTitles
    order: 15
    layout:
      position: beforeBody
      priority: 3
  - source: ./plugins/prev-next
    # series-nav로 대체 — 같은 폴더 날짜순 대신 시리즈 노트에서만 이전·다음 편을 보인다.
    enabled: false
    options: {}
    order: 15
    layout:
      position: afterBody
      priority: 30
  # series-nav는 컴포넌트가 둘이라 엔트리를 둘로 나눈다(엔트리당 컴포넌트 1개 제약).
  # 주의: name이 PascalCase로 컴포넌트를 찾는 키다(series-box → SeriesBox). options는 두 엔트리에 같게 둘 것.
  - source:
      repo: ./plugins/series-nav
      name: series-box
    enabled: true
    # 제목 아래 시리즈 상자(현재 편·이전/다음·접히는 목록). priority 35 = 메타 줄(note-specs 20) 다음.
    options:
      seriesTitles: *seriesTitles
    order: 15
    layout:
      position: beforeBody
      priority: 35
      condition: not-index
  - source:
      repo: ./plugins/series-nav
      name: series-pager
    enabled: true
    # 본문 하단 이전·다음 편. 구 prev-next 자리(afterBody 30).
    options:
      seriesTitles: *seriesTitles
    order: 15
    layout:
      position: afterBody
      priority: 30
  - source: ./plugins/series-roadmap
    enabled: true
    # ```series-roadmap 펜스 → 0편(없으면 1편 들어가며) 본문의 시리즈 로드맵.
    options:
      seriesTitles: *seriesTitles
    order: 57
  - source: ./plugins/related-notes
    enabled: false
    # 노트 하단 Related(링크 > 같은 시리즈 > 개념 태그 순위) — 비활성. 글 끝 Backlinks는 별개 컴포넌트라 그대로 동작한다.
