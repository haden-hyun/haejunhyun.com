# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # 사이트 브랜드명. PageTitle 컴포넌트 + og:site_name에 쓰인다.
  pageTitle: HAEJUN RECORDS
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # 방문 집계는 goatcounter-tracking 플러그인 하나만 쓴다.
  locale: en-US
  baseUrl: haejunhyun.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # 주의: content 기준 glob. `/**`가 있어야 watch 모드(minimatch)에서도 하위 파일이 걸린다.
    - attachments/_staging/**
    - attachments/archive/**
    - test.md
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # 폰트 로딩(Google Fonts URL) + og-image 렌더용.
    # 실제 표시 폰트는 아래 `fonts` 플러그인이 결정한다 — 두 곳을 같이 고칠 것.
    # 세 번째 장소: Obsidian 스니펫 obsidian/theme/haejun-records.css §0 — 색·서체를 바꾸면 같이 고치고 check.mjs로 대조(DESIGN-SYSTEM §4.19).
    # 예외: body의 Inter(라틴 전용)는 Google 슬롯이 하나뿐이라 custom.scss @font-face로 싣는다.
    typography:
      title:
        name: Anton
        weights: [400]
      header:
        name: Hahmlet
        weights: [400, 700, 900]
      body:
        name: Noto Sans KR
        weights: [400, 600, 700]
        includeItalic: false
      code: JetBrains Mono
    # 사이트 색의 단일 소스. 팔레트 "True Midnight" (DESIGN-SYSTEM.md).
    # 텍스트로 렌더되는 모든 값은 AA 4.5 이상을 유지할 것.
    colors:
      lightMode:
        light: "#fcfbf7" # bg · 크림 인쇄지
        lightgray: "#e6e2d8" # border
        gray: "#5f6773" # meta
        darkgray: "#323e4c" # body
        dark: "#141d28" # heading
        secondary: "#1c5f95" # accent
        tertiary: "#17527f" # accent hover
        highlight: rgba(28,95,149,0.10)
        # `==강조==` 형광펜 전체 채움 — 라임, 두 모드 같은 색상.
        textHighlight: "#e2efa6"
      darkMode:
        light: "#0e1420" # bg · 잉크 네이비 (Blue Giant #0c0c24 계열)
        lightgray: "#1e2836" # border
        gray: "#7f8b9c" # meta
        darkgray: "#bcc9d9" # body
        dark: "#e9eff7" # heading
        secondary: "#6fb2e0" # accent
        tertiary: "#9dcdec" # accent hover
        highlight: rgba(111,178,224,0.15)
        # 라임(다크) — 페이지 구분 2.87.
        textHighlight: "#56651a"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      # note-specs `Updated`와 folder/tag 페이지 정렬이 이 값을 쓴다. `updated`는 note-properties가 modified로 매핑한다.
      # 주의: 목록 날짜(posted → created)는 이 값과 무관하게 로컬 플러그인이 직접 읽는다.
      # 주의: published로 바꾸지 말 것 — 해당 키를 가진 노트가 없어 빌드 시각으로 떨어진다.
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      # 주의: 코드 색은 quartz/styles/syntax.scss에서 바꾼다.
      # 아래 theme은 오버라이드가 없는 토큰의 폴백일 뿐이다.
      theme:
        light: catppuccin-latte
        dark: github-dark
      # false = Shiki 배경 대신 Quartz 테마 배경 사용.
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: ./plugins/summary-description
    enabled: true
    options:
      # 원고에 description·요약 콜아웃이 없을 때만 쓰인다. 홈 meta/og description.
      fallbackDescriptions:
        index: "여러 가지 데이터를 다루다 궁금해진 것들을 적어 둡니다."
    # `[!summary]` 콜아웃 본문 → frontmatter.description.
    # order 35 = ofm(30) 이후, description(70) 이전이어야 한다.
    order: 35
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: ./plugins/image-layouts
    enabled: true
    # ```image-layout 코드펜스 → 그리드/메이슨리/캐러셀.
    # 주의: order는 CrawlLinks(60)보다 앞서야 한다. 이 플러그인이 만든 image 노드의
    # 경로를 CrawlLinks가 고쳐줘야 중첩 노트에서 404가 안 난다.
    options:
      defaultLayout: single
      carouselHeight: 24rem
      gap: 0.5rem
    order: 55
  - source: ./plugins/anim-widgets
    enabled: true
    # ```anim 코드펜스 → 단계형 SVG(steps) · 캔버스 루프 데모(canvas) · 루프 영상(video).
    # 주의: .html 자산은 Quartz가 페이지로 취급해 확장자를 떼고 복사하므로 데모는 .js 모듈로 둔다.
    options: {}
    order: 56
  - source: ./plugins/note-specs
    enabled: true
    # 제목 아래 메타 한 줄 — 날짜·읽는 시간·독자 수·개념 태그. priority 20 = 제목(10) 다음, 시리즈 상자(35) 앞.
    options: {}
    order: 15
    layout:
      position: beforeBody
      priority: 20
      display: all
      condition: not-index
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    options:
      maxDepth: 2
    layout:
      position: right
      # 우측 사이드바는 priority 오름차순 배치. toc를 최상단에 둔다.
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    # --titleFont/--headerFont/--bodyFont/--codeFont의 최종 결정처.
    # 옵션을 비우면 플러그인 기본값으로 덮어써지므로 반드시 명시할 것.
    options:
      fontOrigin: local
      title: '"Anton", sans-serif'
      header: '"Hahmlet", serif'
      # "Inter" = 라틴만 그린다(unicode-range), 한글은 글리프 단위로 "Noto Sans KR"에 넘어간다.
      body: '"Inter", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif'
      # code 스택의 "Noto Sans KR" = 코드블럭 한글 폴백(JetBrains Mono엔 한글 글리프가 없다).
      # 한계: 모노스페이스가 아니라 한글 섞인 줄의 세로 정렬이 어긋날 수 있다.
      code: '"JetBrains Mono", "Noto Sans KR", ui-monospace, SFMono-Regular, Menlo, monospace'
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  # ./plugins/folder-listing으로 대체됨.
  # 주의: 둘을 함께 켜지 말 것 — 가상 폴더 페이지는 그것을 만든 pageType의 본문으로 렌더된다.
  - source: github:quartz-community/folder-page
    enabled: false
  - source: ./plugins/folder-listing
    enabled: true
    # 폴더 페이지 = 하위 전체 색인(폴더는 섹션 제목, 노트는 행). 섞인 섹션의 시리즈는 접힌 묶음 카드.
    options:
      showFolderCount: true
      showSubfolders: true
      # 폴더 표시명(H1·섹션·breadcrumb). 폴더 노트 title이 우선, 없으면 Title Case. 단일 소스 — 다른 플러그인은 *folderTitles.
      folderTitles: &folderTitles
        postgresql: "PostgreSQL"
        python-gis: "Python GIS"
        python-operator: "PythonOperator"
      # 시리즈 표시명의 단일 소스. 다른 플러그인은 *seriesTitles 별칭으로 받는다.
      # 주의: Obsidian 미리보기(plugins/series-roadmap/obsidian)의 기본값·볼트 설정은 따로 고칠 것.
      seriesTitles: &seriesTitles
        deep-learning-basics: "딥러닝 기초"
        obsidian-quartz-blog: "Obsidian과 Quartz로 블로그 만들기"
        statistics-basics: "통계학 기초"
        docker-basics: "Airflow를 위한 Docker 기초"
  # ./plugins/tag-listing으로 대체됨. 주의: folder-page와 같은 이유로 둘을 함께 켜지 말 것.
  - source: github:quartz-community/tag-page
    enabled: false
  - source: ./plugins/tag-listing
    enabled: true
    # 태그 페이지 = folder-listing 레코드 행(시리즈 묶음 없음), /tags = 태그 행 색인.
  - source: ./plugins/topics-page
    enabled: true
    # /topics 가상 페이지 = 주제 색인(토픽 섹션 · 시리즈 행 · 1단 폴더 행). 폴더명은 folder-listing이 심은 trie에서 읽는다.
    options:
      seriesTitles: *seriesTitles
  - source: ./plugins/archive-page
    enabled: true
    # /archive 가상 페이지, topics-page와 동일한 패턴.
    options: {}
  # ./plugins/note-catalog로 대체됨.
  # 주의: useSavedState 옵션은 no-op이다. explorer.inline.ts가 그 속성을 읽지 않고
  # localStorage를 무조건 쓴다.
  - source: github:quartz-community/explorer
    enabled: false
  - source: ./plugins/note-catalog
    enabled: true
    # 좌측 CATALOG — 전체 트리 대신 현재 노트의 형제 노트만.
    options:
      title: "CATALOG"
      moreHref: "topics"
      moreLabel: "← All topics"
      # 현재 노트 앞뒤 2편 창. 창 밖은 폴더 페이지 링크로.
      radius: 2
    order: 15
    layout:
      position: left
      priority: 50
      display: desktop-only
      # 홈에서 숨김 — GlobalNav+TopicGrid가 1차 탐색을 대신한다.
      condition: not-index
  - source: ./plugins/topic-graph
    enabled: true
    # 좌측 CATALOG 아래 주제 그래프(폴더 클러스터, 빌드 타임 SVG).
    options:
      title: "GRAPH"
      folderTitles: *folderTitles
    order: 15
    layout:
      position: left
      priority: 60
      display: desktop-only
      condition: not-index
  # ⌘G 전역 그래프 모달만 쓴다. 사이드바 로컬 그래프는 topic-graph 스크립트가 걷어 내고 custom.scss가 숨긴다.
  # 주의: 끄면 ⌘G가 사라진다.
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 60
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: topbar
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      # 글 끝, 시리즈 페이저(30) 다음·댓글(50) 앞.
      position: afterBody
      priority: 40
      display: all
      # 홈에서 제거 — 홈 본문이 비어 있어 백링크가 맥락 없이 뜬다.
      condition: not-index
  - source: ./plugins/global-nav
    enabled: true
    # Home|Topics|Archive 내비. topbar 포지션 = PageTitle과 같은 줄.
    options: {}
    order: 15
    layout:
      position: topbar
      priority: 11
  - source: ./plugins/home-hero
    enabled: true
    # 홈 히어로(헤드라인·이름·설명·링크·메타 + 음표 색소폰). 홈 전용(컴포넌트 내부 slug 가드), priority 1 = 최상단.
    # 설명글은 summary-description의 fallbackDescriptions.index(홈 meta description)를 그대로 쓴다.
    options:
      headline: "Blue Notes."
      author: "Haejun Hyun"
      links:
        - label: "GitHub"
          href: "https://github.com/haden-hyun"
        - label: "LinkedIn"
          href: "https://www.linkedin.com/in/haejun-hyun-332b76243/"
    order: 15
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/featured-notes
    enabled: true
    # Featured. 홈 전용, priority 2 = 히어로 아래 전폭. 번호 목록 4행.
    # slugs가 유일한 지정 수단이다 — 쓴 순서가 표시 순서(번호).
    # 직접 지정한 슬러그는 Recent Notes와 겹쳐도 싣는다. 부족분은 Recent에 없는 노트를 토픽 라운드로빈으로 채운다.
    # 못 찾았거나 중복·초과인 슬러그는 빌드 로그에 경고.
    # 주의: recentExcludeCount는 아래 recent-notes-index.limit과 같은 값으로 유지할 것.
    options:
      recentExcludeCount: 5
      slugs:
        - tools/obsidian/quartz/build/obsidian-quartz-blog
        - finance-property/real-estate/address-pnu
        - data-science/deep-learning/neural-network
        - gis/concept/crs
    order: 15
    layout:
      position: beforeBody
      priority: 2
  - source: ./plugins/topic-grid
    enabled: true
    # Topics. 홈 전용, priority 4 = Recent Notes 우측 단.
    options:
      showHeader: true
    order: 15
    layout:
      position: beforeBody
      priority: 4
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      # 홈은 HomeHero가 헤드라인을 대신 보여주므로 제외 (중복 방지).
      condition: not-index
  # 제목 아래 note-specs 메타 줄이 대신한다.
  - source: github:quartz-community/content-meta
    enabled: false
    layout:
      position: beforeBody
      priority: 20
      display: mobile-only
      # 홈은 인덱스라 날짜·읽기시간 메타가 의미 없다.
      condition: not-index
  # note-specs 메타 줄이 개념 태그를 대신 싣는다.
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
      display: mobile-only
      condition: not-index
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: topbar
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: topbar
      priority: 30
      group: toolbar
  - source: ./plugins/focus-mode
    enabled: true
    # 집중 모드 토글(⌘\) — 검색과 테마 토글 사이. 노트 페이지·데스크톱 전용(컴포넌트 slug 가드 + CSS).
    options: {}
    order: 15
    layout:
      position: topbar
      priority: 25
      group: toolbar
      condition: not-index
  # 집중 모드(focus-mode)가 대신한다 — 업스트림은 사이드 패널 투명도+hover 복원이라 AA 위반(DESIGN-SYSTEM §4.18).
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: topbar
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: haden-hyun/haejunhyun.com
        repoId: R_kgDONbw-1g
        category: Announcements
        categoryId: DIC_kwDONbw-1s4Cky-B
    layout:
      position: afterBody
      priority: 50
      # 홈에서 댓글 섹션 제거 — `0 comments`가 첫인상에 노출되는 것 방지.
      condition: not-index
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: topbar
      priority: 15
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: ./plugins/social-links
    enabled: true
    options:
      links:
        - name: GitHub
          url: https://github.com/haden-hyun/haejunhyun.com
          icon:
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438
            9.8 8.207
            11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729
            1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304
            3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381
            1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005
            2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235
            3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589
            8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        - name: LinkedIn
